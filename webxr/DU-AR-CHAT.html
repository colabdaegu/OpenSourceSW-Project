<html>
  <head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover'>
    <meta name='mobile-web-app-capable' content='yes'>
    <meta name='apple-mobile-web-app-capable' content='yes'>
    <link rel='icon' type='image/png' sizes='32x32' href='../media/logo/dodu-32x32.png'>
    <link rel='icon' type='image/png' sizes='96x96' href='../media/logo/dodu-96x96.png'>
    <link rel='stylesheet' href='../css/common.css'>

    <link rel="stylesheet" href="style.css">

    <title>DU AR-CHAT</title>
  </head>
  <body>
    <header id="ui-box">
      <details open>
        <summary>DU AR-CHAT</summary>
        <p>
          이 샘플은 실제 표면 위에 가상 객체를 배치하기 위해 히트 테스트를 사용하는 기능을 보여줍니다.
          <a class="back" href="/">뒤로가기</a>
        </p>
      </details>
    </header>

    <!-- 3D 모델 캐릭터 머리 위에 띄울 텍스트 -->
    <div id="dodu-label">반가워요! 저는 대구대학교 마스코트 두두라고 해요!</div>

    <!-- 로드뷰(고정 캐릭터) 전용 말풍선 -->
    <div id="dodu-street-view-label"></div>


    <button id="chatToggle" class="chat-toggle-btn" type="button">💬</button>
    <button id="listeningBtn" class="listening-btn" type="button">🔊</button>
    <button id="guitarBtn" class="guitar-btn" type="button">🎵</button>

    <div class="char-toggle-group">
      <button id="char1Toggle" class="char-toggle-btn" type="button">
        1
      </button>
      <button id="char2Toggle" class="char-toggle-btn" type="button">
        2
      </button>
      <button id="char3Toggle" class="char-toggle-btn" type="button">
        3
      </button>
    </div>

    <button id="collegeDescriptionBtn" class="college-description-btn" type="button">🏫　　IT·공과대학에 대해서 </button>
    <button id="departmentDescriptionBtn" class="department-description-btn" type="button">📚 　 컴퓨터소프트웨어 소개</button>

    <div id="remoteControlLabel">캠퍼스 이동</div>
    <div id="remoteControl">
      <button id="btnUp">▲</button>
      <button id="btnDown">▼</button>
    </div>

    <div id="toast"></div>

    <button id="mapBtn" class="map-btn" type="button">
      <img src="../media/textures/map-logo.png" alt="map" />
    </button>

    <style>
      #dodu3d, #dodu-label, #dodu-street-view-label, #log, #chatbar, #block, #chatToggle, #listeningBtn, #guitarBtn, #collegeDescriptionBtn, #departmentDescriptionBtn, #remoteControl, #remoteControlLabel, #mapBtn, #streetViewStage, #btnRoadviewToggle,
      .char-toggle-group {
        display: none; 
      }
    </style>
    <model-viewer
      id="holding-phone-3d"
      src="../media/gltf/holding-phone/holding-phone.gltf"
      autoplay
      camera-controls
      interaction-prompt-style="wiggle"
      disable-zoom
      exposure="1"
      environment-image="neutral"
    ></model-viewer>
    <model-viewer
      id="dodu3d"
      src="../media/gltf/dodu/dodu.gltf"
      autoplay
      disable-zoom
      exposure="1"
      environment-image="neutral"
      shadow-intensity="1"
      shadow-softness="1"
      interaction-prompt="none"
    ></model-viewer>

    <div id="streetViewStage">
      <div id="kakaoContainer" class="view_roadview">
        <!-- 지도 -->
        <div id="mapWrapper">
          <div id="kakaoMap"></div>
        </div>

        <!-- 로드뷰 -->
        <div id="rvWrapper">
          <div id="streetView"></div>
        </div>

        <!-- 왼쪽 상단 전환 버튼 -->
        <button id="btnRoadviewToggle" type="button">로드뷰</button>
      </div>
    </div>

    <!-- ====== 채팅 UI ====== -->
    <div id="chatShell">
      <!-- 대화 로그 영역 -->
      <div id="log"></div>

      <!-- 하단 채팅 바 -->
      <div id="chatbar">
        <input id="msg" name="chat_msg" type="search" placeholder="메시지를 입력하세요..." autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="text" enterkeyhint="send" />
        <button id="mic" type="button" style="display:flex;align-items:center;justify-content:center;font-weight:700;">
          <img src="../media/textures/microphone-button.png" alt="🎙" width="24" height="24"/>
        </button>
        <button id="send" type="button" style="display:flex;align-items:center;justify-content:center;font-weight:700;">전송</button>
      </div>

      <div id="block" aria-hidden="true"></div>
    </div>
    
    <script src="/ngrok-address.js"></script>
    <script src="/js/mobile-keyboard.js"></script>
    <script src="app.js"></script>

    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=__KAKAO_MAP_APPKEY__"></script>

    <script type="module">
      import {WebXRButton} from '../js/util/webxr-button.js';
      import {Scene} from '../js/render/scenes/scene.js';
      import {Renderer, createWebGLContext} from '../js/render/core/renderer.js';
      import {Node} from '../js/render/core/node.js';
      import {Gltf2Node} from '../js/render/nodes/gltf2.js';
      import {DropShadowNode} from '../js/render/nodes/drop-shadow.js';
      //import {vec3} from '../js/render/math/gl-matrix.js';
      import {vec3, mat4, vec4} from '../js/render/math/gl-matrix.js';
      import {Ray} from '../js/render/math/ray.js';


      // 캐릭터 생성되지 않음
      window.hasDoduPlaced = false;
      window.hasStreetDoduPlaced = false;

      // 로드뷰 전역 객체
      let streetView = null;
      let streetViewClient = null;

      // 카카오 지도 전역
      let kakaoMap = null;
      let kakaoMapMarker = null;

      // 모드: true=로드뷰, false=지도 (컨테이너 class로 제어)
      let isRoadviewMode = true;
      window.isKakaoMapMode = false;

      // 음성인식 중 AR인식 차단
      window.__uiPointerBlockSelect = false;

      // =======================
      // 로드뷰 좌표 테이블 (0~12)
      // https://apis.map.kakao.com/web/sample/addMapClickEventWithMarker/
      // =======================
      const STREETVIEW_POSITIONS = [
        { lat: 35.902330854481235,  lng: 128.84372684313558, pan: 0  },  // 0 - 공공인재대학
        { lat: 35.901387001082604,  lng: 128.85060488923892, pan: 130  },  // 1 - 글로벌경영대학
        { lat: 35.901364764471964,  lng: 128.84179669881323, pan: 105  },  // 2 - 사회과학대학
        { lat: 35.903111497273194,  lng: 128.85622160407024, pan: 223  },  // 3 - 보건바이오대학
        { lat: 35.898668791496114,  lng: 128.85507402228905, pan: 15   },  // 4 - IT·공과대학 
        { lat: 35.90253775928005,  lng: 128.84521576298965, pan: 34  },  // 5 - 디자인예술대학
        { lat: 35.899513951312755,  lng: 128.84657424174395, pan: 0  },  // 6 - 사범대학
        { lat: 35.89968880330472,  lng: 128.85262531455385, pan: 71.5  },  // 7 - 재활과학대학
        { lat: 35.90347157646457,  lng: 128.84923852280758, pan: 315  },  // 8 - 체육레저학부
        { lat: 35.89906791852828,  lng: 128.84993899263768, pan: 150  },  // 9 - 문화콘텐츠학부
        { lat: 35.89897618587197, lng: 128.84989809487084, pan: 108 },  // 10 - 자유전공학부
        { lat: 35.85665449257892, lng: 128.5753815771618, pan: 63 },  // 11 - 글로컬라이프대학
        { lat: 35.85529786579435, lng: 128.57627072633176, pan: 106 },  // 12 - 간호대학
      ];

      // =======================
      // 지도 좌표 테이블 (0~12)
      // https://apis.map.kakao.com/web/sample/addMapClickEventWithMarker/
      // =======================
      const KAKAOMAP_POSITIONS = [
        { lat: 35.902609034735455,  lng: 128.84365576861956  },  // 0 - 공공인재대학
        { lat: 35.90092057376448,  lng: 128.85090413545583  },  // 1 - 글로벌경영대학
        { lat: 35.90136145545498,  lng: 128.8427463340613  },  // 2 - 사회과학대학
        { lat: 35.90285268539933,  lng: 128.8559137500071  },  // 3 - 보건바이오대학
        { lat: 35.89906796851798,  lng: 128.85519132096226   },  // 4 - IT·공과대학 
        { lat: 35.90300793906611,  lng: 128.845697393005  },  // 5 - 디자인예술대학
        { lat: 35.90011212258426,  lng: 128.84649677011055  },  // 6 - 사범대학
        { lat: 35.89994162534254,  lng: 128.85302991315424  },  // 7 - 재활과학대학
        { lat: 35.90383394163952,  lng: 128.84896729457327  },  // 8 - 체육레저학부
        { lat: 35.89882812876081,  lng: 128.85029611704235  },  // 9 - 문화콘텐츠학부
        { lat: 35.89882812876081, lng: 128.85029611704235  },  // 10 - 자유전공학부
        { lat: 35.856763661667046, lng: 128.57581822048442  },  // 11 - 글로컬라이프대학
        { lat: 35.85529917541896, lng: 128.5765142795892  },  // 12 - 간호대학
      ];
      


      // 줄바꿈 스크립트
      function autoWrapText(text, maxChars = 20, maxSpaces = 5) {
        let result = "";
        let countChars = 0;
        let countSpaces = 0;

        for (let i = 0; i < text.length; i++) {
          const ch = text[i];

          countChars++;
          if (ch === " ") countSpaces++;

          if (countChars > maxChars || countSpaces >= maxSpaces) {
            result += "\n";
            countChars = 0;
            countSpaces = 0;
          }

          result += ch;
        }
        return result;
      }
      window.autoWrapText = autoWrapText;


      const charGroup = document.querySelector(".char-toggle-group");

      // 최근에 UI를 탭한 시점 (ms 기준)
      let lastUiTapTime = 0;
      const UI_TAP_IGNORE_WINDOW = 300; // 밀리초 (0.3초 안에 select 들어오면 무시)

      // "UI로 취급할 영역" 셀렉터: 여기 들어간 애들 눌렀을 땐 AR 배치 무시
      const UI_ROOT_SELECTOR = '#chatToggle, #listeningBtn, #guitarBtn, #log, #chatbar, #mic, #send, #block, #ui-box, #char1Toggle, #char2Toggle, #char3Toggle, #collegeDescriptionBtn, #departmentDescriptionBtn, #remoteControl, #remoteControlLabel, #mapBtn, #streetViewStage, #btnRoadviewToggle';
      

      window.addEventListener('pointerdown', (ev) => {
        const target = ev.target;
        if (!target) return;

        // 위에서 정한 UI 영역 안에 있는지 확인
        if (target.closest(UI_ROOT_SELECTOR)) {
          lastUiTapTime = performance.now();
          // console.log('UI tapped, suppress next XR select');
        }
      }, { capture: true });

      window.addEventListener("pointerup", () => {
        window.__uiPointerBlockSelect = false;
      }, { capture: true });

      window.addEventListener("pointercancel", () => {
        window.__uiPointerBlockSelect = false;
      }, { capture: true });


      /* =========================
        버튼 배치
        ========================= */


      // XR globals.
      let xrButton = null;
      let xrRefSpace = null;
      let xrViewerSpace = null;
      let xrHitTestSource = null;

      // WebGL scene globals.
      let gl = null;
      let renderer = null;
      let scene = new Scene();
      scene.enableStats(false);

      let arObject = new Node();
      arObject.visible = false;
      scene.addNode(arObject);
      

      // ==== 3D 모델 캐릭터(두두) 기본 모델들 ====
      const CHARACTER_URLS = [
        '../media/gltf/dodu/dodu.gltf',       // char1
        '../media/gltf/dodu_2/dodu_2.gltf',   // char2
        '../media/gltf/dodu_3/dodu_3.gltf',   // char3
      ];

      let currentCharIndex = 0; // 0: dodu, 1: dodu_2, 2: dodu_3


      function setOverlayModelByIndex(index) {
        const mv = document.getElementById("dodu3d");
        if (!mv) return;
        if (index < 0 || index >= CHARACTER_URLS.length) return;

        const next = CHARACTER_URLS[index];
        if (mv.getAttribute("src") === next) return;

        mv.setAttribute("src", next);
      }

      /* 로드뷰 - 3D 모델 캐릭터 X좌표 및 말풍선 X좌표 조절 */
      const STREET_X = [
        { char:  0, bubble:  -18 },  // 캐릭터 1
        { char:  0, bubble:  16 },  // 캐릭터 2
        { char:  0, bubble: 4 },  // 캐릭터 3
      ];

      function updateStreetViewPosition() {
        const charEl   = document.getElementById("dodu3d");
        const bubbleEl = document.getElementById("dodu-street-view-label");

        const pos = STREET_X[currentCharIndex] || STREET_X[0];

        // 캐릭터 이동
        if (charEl) {
          charEl.style.left = `calc(50% + ${pos.char}px)`;
        }

        // 말풍선 이동
        if (bubbleEl) {
          bubbleEl.style.left = `calc(50% + ${pos.bubble}px)`;
        }
      }


      // 로드뷰 이동 함수
      function moveStreetViewToIndex(index) {
        if (!ensureStreetViewCreated()) return;

        const rvPos = STREETVIEW_POSITIONS[index];   // 로드뷰용
        const mapPos = KAKAOMAP_POSITIONS[index];    // 지도용

        if (!rvPos || !mapPos) {
          console.warn("좌표 없음:", index);
          return;
        }
        
        const mapLatLng = new kakao.maps.LatLng(mapPos.lat, mapPos.lng);
        const rvLatLng  = new kakao.maps.LatLng(rvPos.lat, rvPos.lng);

        // 1) 지도도 같이 이동
        if (kakaoMap) {
          kakaoMap.setCenter(mapLatLng);
        }
        if (kakaoMapMarker) {
          kakaoMapMarker.setPosition(mapLatLng);
        }

        // 2) 로드뷰 이동
        streetViewClient.getNearestPanoId(rvLatLng, 50, function (panoId) {
          if (!panoId) {
            console.warn("panoId 없음:", index);
            return;
          }
          streetView.setPanoId(panoId, rvLatLng);
          streetView.setViewpoint({ pan: rvPos.pan, tilt: 0, zoom: -100 });
        });
      }
      window.moveStreetViewToIndex = moveStreetViewToIndex;




      // =======================
      // streetView overlay toggle
      // =======================
      let streetViewVisible = false;

      // 맵(로드뷰) 진입 전 AR - 3D 모델 캐릭터 상태 백업용
      let prevARState = {
        hasDoduPlaced: false,
        currentDodu: null,
        arVisible: false,
      };

      function applyModeUI(isRoadview) {
        const container = document.getElementById("kakaoContainer");
        if (!container) return;

        container.className = isRoadview ? "view_roadview" : "view_map";
        isRoadviewMode = isRoadview;

        const btnRoadviewToggle = document.getElementById("btnRoadviewToggle");
        if (btnRoadviewToggle) {
          btnRoadviewToggle.textContent = isRoadview ? "지도" : "로드뷰";
        }

        const mv = document.getElementById("dodu3d");
        const streetLabelEl = document.getElementById("dodu-street-view-label");

        const charGroupEl = document.querySelector(".char-toggle-group");
        if (charGroupEl) {
          // 로드뷰면 보이게, 지도면 숨기기
          charGroupEl.style.display = isRoadview ? "inline-flex" : "none";
        }

        if (isRoadview) {
          // 로드뷰: 캐릭터/말풍선 정상
          if (mv) mv.style.display = "block";
          window.hasStreetDoduPlaced = true;
          window.isKakaoMapMode = false;
        } else {
          // 지도: 캐릭터/말풍선/TTS 비활성
          if (mv) mv.style.display = "none";
          window.hasStreetDoduPlaced = false;

          if (streetLabelEl) {
            streetLabelEl.style.display = "none";
            streetLabelEl.textContent = "";
          }

          // TTS 강제 중단
          if (window.speechSynthesis) {
            window.speechSynthesis.cancel();
          }
          window.isKakaoMapMode = true;
        }
      }

      function toggleRoadviewMapMode() {
        // 현재 모드 반전
        applyModeUI(!isRoadviewMode);
      }
      window.toggleRoadviewMapMode = toggleRoadviewMapMode;


      function ensureStreetViewCreated() {
        if (!window.kakao || !window.kakao.maps) return false;
        if (streetView && streetViewClient && kakaoMap) return true;

        const streetViewContainer = document.getElementById("streetView");
        const mapContainer = document.getElementById("kakaoMap");

        streetView = new kakao.maps.Roadview(streetViewContainer, {
          zoomControl: false,
          viewpointControl: false,
        });
        streetViewClient = new kakao.maps.RoadviewClient();

        // 지도 생성 (기본 center는 0번으로)
        const idx = (typeof window.remoteIndex === "number") ? window.remoteIndex : 0;
        const pos = STREETVIEW_POSITIONS[idx];
        const center = new kakao.maps.LatLng(pos.lat, pos.lng);

        kakaoMap = new kakao.maps.Map(mapContainer, {
          center,
          level: 3,
        });

        kakaoMapMarker = new kakao.maps.Marker({ position: center });
        kakaoMapMarker.setMap(kakaoMap);

        // 생성 직후 강제 relayout (display:none 상태에서 생성됐을 수 있으니까)
        setTimeout(() => {
          if (kakaoMap) kakaoMap.relayout();
          if (streetView && typeof streetView.relayout === "function") streetView.relayout();
          // 중심도 한 번 더 잡아주면 더 안정적
          if (kakaoMap) kakaoMap.setCenter(center);
        }, 0);

        return true;
      }


      function showStreetViewOverlay() {
        // 맵 들어가기 전 AR 상태 백업
        prevARState.hasDoduPlaced = window.hasDoduPlaced;
        prevARState.currentDodu = currentDodu;
        prevARState.arVisible = arObject.visible;

        ensureStreetViewCreated();

        // 로드뷰 진입 안내
        if (typeof appendNotice === "function") {
          appendNotice(
            "[로드뷰 화면은 카카오맵 API를 등록하면 표시됩니다.]"
          );
        }

        const streetViewStageEl = document.getElementById("streetViewStage");
        if (streetViewStageEl) streetViewStageEl.style.display = "block";

        // 로드뷰 먼저 전개
        applyModeUI(true);

        // 로드뷰 시작 위치
        moveStreetViewToIndex(
          (typeof window.remoteIndex === "number") ? window.remoteIndex : 0
        );

        // 오버레이용 캐릭터 ON
        const mv = document.getElementById("dodu3d");
        updateStreetViewPosition();
        if (mv) mv.style.display = "block";

        window.hasStreetDoduPlaced = true;

        // AR 말풍선은 끄기(겹침 방지)
        window.hasDoduPlaced = false;
        currentDodu = null;
        const arLabel = document.getElementById("dodu-label");
        if (arLabel) {
          arLabel.style.display = "none";
          arLabel.textContent = "";
        }

        // 리모컨 UI 보이기
        const remoteControl = document.getElementById("remoteControl");
        const remoteLabel = document.getElementById("remoteControlLabel");
        if (remoteControl) remoteControl.style.display = "flex";
        if (remoteLabel) remoteLabel.style.display = "block";

        // 로드뷰 <-> 지도 전환 버튼 보이기
        const btnRoadviewToggle = document.getElementById("btnRoadviewToggle");
        if (btnRoadviewToggle) btnRoadviewToggle.style.display = "block";

        // 첵갈피 숨기기
        const collegeDescriptionBtn = document.getElementById("collegeDescriptionBtn");
        const departmentDescriptionBtn = document.getElementById("departmentDescriptionBtn");
        if (collegeDescriptionBtn) {
          collegeDescriptionBtn.style.display = "none";
          collegeDescriptionBtn.style.right = getComputedStyle(collegeDescriptionBtn).right;
        }
        if (departmentDescriptionBtn) {
          departmentDescriptionBtn.style.display = "none";
          departmentDescriptionBtn.style.right = getComputedStyle(departmentDescriptionBtn).right;
        }

        // 첫 진입 멘트
        const idx = (typeof window.remoteIndex === "number") ? window.remoteIndex : 0;
        if (typeof window.requestRemotePromptAnswer === "function") {
          window.requestRemotePromptAnswer(idx);
        }

        const mapBtnImg = document.querySelector("#mapBtn img");
        if (mapBtnImg) mapBtnImg.src = "../media/textures/cube-sea.png";

        reticle.visible = false;
        streetViewVisible = true;
      }

      function hideStreetViewOverlay() {
        // 오버레이용 캐릭터 OFF

      // Adds a new object to the scene at the
      // specified transform.
      function addARObjectAt(matrix) {
        arObject.visible = true;

        // matrix 복사
        const m = mat4.clone(matrix);

        /** Y축으로 아래로 내리기 (값 조절 포인트) **/
        mat4.translate(m, m, [0, 0.0, 0]);

        arObject.matrix = m;
        currentDodu = arObject;
      

        // 필요하면 배열에 한 번만 넣어둠
        if (!dodus.includes(arObject)) {
          dodus.push(arObject);
        }

        if (typeof window.playUiSound === "function") {
          window.playUiSound(5);
        }

        window.hasDoduPlaced = true;

        // 3D 모델 캐릭터 라벨도 켜기
        const labelEl = document.getElementById("dodu-label");
        if (labelEl) {
          if (window.hasStreetDoduPlaced) {
            labelEl.style.display = "none";
          } else {
            if (labelEl.textContent && labelEl.textContent.trim().length > 0) {
              // 내용이 있을 때만 보여주기
              labelEl.style.display = "block";
            } else {
              // 내용이 없으면 완전히 숨김
              labelEl.style.display = "none";
            }
          }
        }

        // For performance reasons if we add too many objects start
        // removing the oldest ones to keep the scene complexity
        // from growing too much.
        if (dodus.length > MAX_DODUS) {
          let oldDodu = dodus.shift();
          scene.removeNode(oldDodu);
        }
      }

      let rayOrigin = vec3.create();
      let rayDirection = vec3.create();
      function onSelect(event) {
        // 로드뷰 켜져 있으면 AR - reticle 배치 금지
        if (streetViewVisible) {
          reticle.visible = false;
          return;
        }

        // 마이크 버튼 - AR 배치 금지
        if (window.__uiPointerBlockSelect) return;
        const now = performance.now();
        if (now - lastUiTapTime < UI_TAP_IGNORE_WINDOW) return;

        if (reticle.visible) {
          // 최근에 UI를 탭했다면 이 select는 무시
          const now = performance.now();
          if (now - lastUiTapTime < UI_TAP_IGNORE_WINDOW) {
            // console.log('Ignoring XR select caused by UI tap');
            return;
          }

          // The reticle should already be positioned at the latest hit point, 
          // so we can just use it's matrix to save an unnecessary call to 
          // event.frame.getHitTestResults.
          addARObjectAt(reticle.matrix);
        }
      }

      // Called every time a XRSession requests that a new frame be drawn.
      function onXRFrame(t, frame) {
        let session = frame.session;
        let pose = frame.getViewerPose(xrRefSpace);

        reticle.visible = false;

        // 로드뷰 켜져 있으면 reticle 업데이트 자체를 스킵
        if (streetViewVisible) {
          // 로드뷰 켜져 있으면 안내 3D도 숨김
          updateHoldingPhoneVisibility(false);
          holdingPhoneShown = false;
          reticleMissingSince = null;

          session.requestAnimationFrame(onXRFrame);
          return;
        }

        // If we have a hit test source, get its results for the frame
        // and use the pose to display a reticle in the scene.
        if (xrHitTestSource && pose) {
          let hitTestResults = frame.getHitTestResults(xrHitTestSource);
          if (hitTestResults.length > 0) { 
            let pose = hitTestResults[0].getPose(xrRefSpace);
            let m = pose.transform.matrix;

            // Y축이 거의 1이면 = 0도 (바닥)
            const yUp = m[5]; // column-major 기준

            if (yUp >= 0.9) {
              reticle.visible = true;
              reticle.matrix = m;
            } else {
              reticle.visible = false;
            }
          }
        }


        // 안내 3D 토글
        {
          const now = performance.now();

          // reticle이 보이거나(공간 인식 성공) OR AR 캐릭터로부터 카메라 시점이 이탈한 상태이면
          if (reticle.visible || (window.hasDoduPlaced && isDoduVisibleToCamera)) {
            reticleMissingSince = null;

            if (holdingPhoneShown) {
              updateHoldingPhoneVisibility(false);
              holdingPhoneShown = false;
            }
          } else {
            // reticle이 안 보이는 상태(=공간 인식 실패)가 지속되는지 체크
            if (reticleMissingSince === null) reticleMissingSince = now;

            const missingFor = now - reticleMissingSince;

            // 실패 시간이 임계값을 넘었을 때
            if (missingFor >= HOLDING_PHONE_DELAY_MS) {
              if (!holdingPhoneShown) {
                updateHoldingPhoneVisibility(true);
                holdingPhoneShown = true;
              }
            } else {
              // 해당 구간에서는 절대 안내 3D를 띄우지 않음
              if (holdingPhoneShown) {
                updateHoldingPhoneVisibility(false);
                holdingPhoneShown = false;
              }
            }
          }
        }


        // 3D 모델 캐릭터 머리 3D 위치를 2D 화면 좌표로 투영해서 라벨 위치를 맞춰줌
        {
          const labelEl = document.getElementById("dodu-label");
          if (labelEl && window.hasStreetDoduPlaced) {
            labelEl.style.display = "none";
            labelEl.textContent = "";
          } else if (labelEl && currentDodu && pose && pose.views.length > 0) {
            const view = pose.views[0];

            const viewMat = mat4.create();
            mat4.invert(viewMat, view.transform.matrix);

            const projMat = view.projectionMatrix;

            // 3D 모델 캐릭터 로컬 좌표계 기준 "머리 위" 위치 (원하면 Y값 조절)
            const localHeadPos = getHeadLocalPos();
            const worldHeadPos = vec3.create();
            vec3.transformMat4(worldHeadPos, localHeadPos, currentDodu.matrix);

            // world → view → clip → NDC → screen
            const worldPos4 = vec4.fromValues(
              worldHeadPos[0],
              worldHeadPos[1],
              worldHeadPos[2],
              1.0
            );
            const viewPos4 = vec4.create();
            const clipPos4 = vec4.create();

            vec4.transformMat4(viewPos4, worldPos4, viewMat);
            vec4.transformMat4(clipPos4, viewPos4, projMat);

            // 카메라 뒤에 있으면 숨김
            if (clipPos4[3] <= 0) {
              labelEl.style.visibility = "hidden";
              isDoduVisibleToCamera = false;
            } else {
              labelEl.style.visibility = "visible";
              isDoduVisibleToCamera = true;

              const ndcX = clipPos4[0] / clipPos4[3];
              const ndcY = clipPos4[1] / clipPos4[3];

              const x = (ndcX * 0.5 + 0.5) * window.innerWidth;
              const y = (-ndcY * 0.5 + 0.5) * window.innerHeight;

              labelEl.style.left = `${x}px`;

              // Y 오프셋은 transform이 아니라 top에서 직접 빼기
              // 말풍선 높이를 읽어서 머리 위로 올림
              const bubbleH = labelEl.offsetHeight || 0;
              const gapPx = 0;
              labelEl.style.top = `${y - bubbleH - gapPx}px`;

              // world-up(0,1,0)을 view 공간으로 보낸 뒤, x/y로 roll 각도 계산
              const worldUp4 = vec4.fromValues(0, 1, 0, 0); // 방향벡터라 w=0
              const viewUp4  = vec4.create();
              vec4.transformMat4(viewUp4, worldUp4, viewMat);

              // roll
              const rollRad = Math.atan2(viewUp4[0], viewUp4[1]);

              // transform에는 X중앙정렬 + roll만
              labelEl.style.transformOrigin = "50% 100%";
              labelEl.style.transform = `translateX(-50%) rotate(${rollRad}rad)`;
            }
          }
        }


        scene.startFrame();

        session.requestAnimationFrame(onXRFrame);

        scene.drawXRFrame(frame, pose);

        scene.endFrame();
      }

      // Start the XR application.
      initXR();
    </script>

    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  </body>
