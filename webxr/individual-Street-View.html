    <!-- 로드뷰(고정 캐릭터) 전용 말풍선 -->

      // 캐릭터 생성되지 않음

        { lat: 35.902330854481235,  lng: 128.84372684313558, pan: 0  },  // 0 - 공공인재대학
        { lat: 35.901387001082604,  lng: 128.85060488923892, pan: 130  },  // 1 - 글로벌경영대학

        { lat: 35.903111497273194,  lng: 128.85622160407024, pan: 223  },  // 3 - 보건바이오대학
        { lat: 35.898668791496114,  lng: 128.85507402228905, pan: 15   },  // 4 - IT·공과대학

        { lat: 35.899513951312755,  lng: 128.84657424174395, pan: 0  },  // 6 - 사범대학
        { lat: 35.89968880330472,  lng: 128.85262531455385, pan: 71.5  },  // 7 - 재활과학대학
        { lat: 35.90347157646457,  lng: 128.84923852280758, pan: 315  },  // 8 - 체육레저학부
        { lat: 35.89906791852828,  lng: 128.84993899263768, pan: 150  },  // 9 - 문화콘텐츠학부
        { lat: 35.89897618587197, lng: 128.84989809487084, pan: 108 },  // 10 - 자유전공학부
        { lat: 35.85665449257892, lng: 128.5753815771618, pan: 63 },  // 11 - 글로컬라이프대학
        { lat: 35.85529786579435, lng: 128.57627072633176, pan: 106 },  // 12 - 간호대학
      ];

      // =======================
      // 지도 좌표 테이블 (0~12)
      // https://apis.map.kakao.com/web/sample/addMapClickEventWithMarker/
      // =======================
      const KAKAOMAP_POSITIONS = [
        { lat: 35.902609034735455,  lng: 128.84365576861956  },  // 0 - 공공인재대학
        { lat: 35.90092057376448,  lng: 128.85090413545583  },  // 1 - 글로벌경영대학
        { lat: 35.90136145545498,  lng: 128.8427463340613  },  // 2 - 사회과학대학
        { lat: 35.90285268539933,  lng: 128.8559137500071  },  // 3 - 보건바이오대학
        { lat: 35.89906796851798,  lng: 128.85519132096226   },  // 4 - IT·공과대학 
        { lat: 35.90300793906611,  lng: 128.845697393005  },  // 5 - 디자인예술대학
        { lat: 35.90011212258426,  lng: 128.84649677011055  },  // 6 - 사범대학
        { lat: 35.89994162534254,  lng: 128.85302991315424  },  // 7 - 재활과학대학
        { lat: 35.90383394163952,  lng: 128.84896729457327  },  // 8 - 체육레저학부
        { lat: 35.89882812876081,  lng: 128.85029611704235  },  // 9 - 문화콘텐츠학부
        { lat: 35.89882812876081, lng: 128.85029611704235  },  // 10 - 자유전공학부
        { lat: 35.856763661667046, lng: 128.57581822048442  },  // 11 - 글로컬라이프대학
        { lat: 35.85529917541896, lng: 128.5765142795892  },  // 12 - 간호대학
      ];

      


      // 줄바꿈 스크립트
      function autoWrapText(text, maxChars = 20, maxSpaces = 5) {
        let result = "";
        let countChars = 0;
        let countSpaces = 0;

        for (let i = 0; i < text.length; i++) {
          const ch = text[i];

          countChars++;
          if (ch === " ") countSpaces++;

          if (countChars > maxChars || countSpaces >= maxSpaces) {
            result += "\n";
            countChars = 0;
            countSpaces = 0;
          }

          result += ch;
        }
        return result;
      }
      window.autoWrapText = autoWrapText;

      const charGroup = document.querySelector(".char-toggle-group");

      // 최근에 UI를 탭한 시점 (ms 기준)
      let lastUiTapTime = 0;
      const UI_TAP_IGNORE_WINDOW = 300; // 밀리초 (0.3초 안에 select 들어오면 무시)

      // "UI로 취급할 영역" 셀렉터: 여기 들어간 애들 눌렀을 땐 AR 배치 무시
      const UI_ROOT_SELECTOR = '#chatToggle, #listeningBtn, #guitarBtn, #log, #chatbar, #block, #ui-box, #char1Toggle, #char2Toggle, #char3Toggle, #remoteControl, #remoteControlLabel, #streetViewStage, #btnRoadviewToggle';
      

      window.addEventListener('pointerdown', (ev) => {
        const target = ev.target;
        if (!target) return;

        // 위에서 정한 UI 영역 안에 있는지 확인
        if (target.closest(UI_ROOT_SELECTOR)) {
          lastUiTapTime = performance.now();
          // console.log('UI tapped, suppress next XR select');
        }
      });

      


      /* =========================
        버튼 배치
        ========================= */


      // XR globals.
      let xrButton = null;
      let xrRefSpace = null;
      let xrViewerSpace = null;
      let xrHitTestSource = null;

      // WebGL scene globals.
      let gl = null;
      let renderer = null;
      let scene = new Scene();
      scene.enableStats(false);

      let arObject = new Node();
      arObject.visible = false;
      scene.addNode(arObject);
      

      // ==== 3D 모델 캐릭터(두두) 기본 모델들 ====
      const CHARACTER_URLS = [
        '../media/gltf/dudu/dudu.gltf',       // char1
        '../media/gltf/dudu_2/dudu_2.gltf',   // char2
        '../media/gltf/dudu_3/dudu_3.gltf',   // char3
      ];

      let currentCharIndex = 0; // 0: dudu, 1: dudu_2, 2: dudu_3


      function setOverlayModelByIndex(index) {
        const mv = document.getElementById("dudu3d");
        if (!mv) return;
        if (index < 0 || index >= CHARACTER_URLS.length) return;

        const next = CHARACTER_URLS[index];
        if (mv.getAttribute("src") === next) return;

        mv.setAttribute("src", next);
      }

      /* 로드뷰 - 3D 모델 캐릭터 X좌표 및 말풍선 X좌표 조절 */
      const STREET_X = [
        { char:  0, bubble:  -18 },  // 캐릭터 1
        { char:  0, bubble:  16 },  // 캐릭터 2
        { char:  0, bubble: 4 },  // 캐릭터 3
      ];

      function updateStreetViewPosition() {
        const charEl   = document.getElementById("dudu3d");
        const bubbleEl = document.getElementById("dudu-street-view-label");

        const pos = STREET_X[currentCharIndex] || STREET_X[0];

        // 캐릭터 이동
        if (charEl) {
          charEl.style.left = `calc(50% + ${pos.char}px)`;
        }

        // 말풍선 이동
        if (bubbleEl) {
          bubbleEl.style.left = `calc(50% + ${pos.bubble}px)`;
        }
      }


      // 로드뷰/지도 생성 & 토글
      function ensureStreetViewCreated() {
        if (!window.kakao || !window.kakao.maps) return false;
        if (streetView && streetViewClient && kakaoMap) return true;

        const streetViewContainer = document.getElementById("streetView");
        const mapContainer = document.getElementById("kakaoMap");

        streetView = new kakao.maps.Roadview(streetViewContainer, {
          zoomControl: false,
          viewpointControl: false,
        });
        streetViewClient = new kakao.maps.RoadviewClient();

        // 지도 생성 (기본 center는 0번으로)
        const idx = typeof window.remoteIndex === "number" ? window.remoteIndex : 0;
        const pos = STREETVIEW_POSITIONS[idx];
        const center = new kakao.maps.LatLng(pos.lat, pos.lng);

        kakaoMap = new kakao.maps.Map(mapContainer, {
          center,
          level: 3,
        });

        kakaoMapMarker = new kakao.maps.Marker({ position: center });
        kakaoMapMarker.setMap(kakaoMap);

        // display:none 생성 이슈 방지 relayout
        setTimeout(() => {
          if (kakaoMap) kakaoMap.relayout();
          if (streetView && typeof streetView.relayout === "function") streetView.relayout();
          if (kakaoMap) kakaoMap.setCenter(center);
        }, 0);

        return true;
      }

      function applyModeUI(isRoadview) {
        const container = document.getElementById("kakaoContainer");
        if (!container) return;

        container.className = isRoadview ? "view_roadview" : "view_map";
        isRoadviewMode = isRoadview;

        const btnRoadviewToggle = document.getElementById("btnRoadviewToggle");
        if (btnRoadviewToggle) btnRoadviewToggle.textContent = isRoadview ? "지도" : "로드뷰";

        const mv = document.getElementById("dudu3d");
        const streetLabelEl = document.getElementById("dudu-street-view-label");
        const charGroupEl = document.querySelector(".char-toggle-group");

        if (charGroupEl) {
          charGroupEl.style.display = isRoadview ? "inline-flex" : "none";
        }

        if (isRoadview) {
          if (mv) mv.style.display = "block";
          window.hasStreetDuduPlaced = true;
          window.isKakaoMapMode = false;
        } else {
          if (mv) mv.style.display = "none";
          window.hasStreetDuduPlaced = false;

          if (streetLabelEl) {
            streetLabelEl.style.display = "none";
            streetLabelEl.textContent = "";
          }

          if (window.speechSynthesis) window.speechSynthesis.cancel();
          window.isKakaoMapMode = true;
        }
      }

      function toggleRoadviewMapMode() {
        applyModeUI(!isRoadviewMode);
      }
      window.toggleRoadviewMapMode = toggleRoadviewMapMode;

      // 로드뷰 이동 함수
      function moveStreetViewToIndex(index) {
        if (!ensureStreetViewCreated()) return;

        const rvPos = STREETVIEW_POSITIONS[index];
        const mapPos = KAKAOMAP_POSITIONS[index];

        if (!rvPos || !mapPos) {
          console.warn("좌표 없음:", index);
          return;
        }

        const mapLatLng = new kakao.maps.LatLng(mapPos.lat, mapPos.lng);
        const rvLatLng = new kakao.maps.LatLng(rvPos.lat, rvPos.lng);

        if (kakaoMap) kakaoMap.setCenter(mapLatLng);
        if (kakaoMapMarker) kakaoMapMarker.setPosition(mapLatLng);

        streetViewClient.getNearestPanoId(rvLatLng, 50, function (panoId) {
          if (!panoId) {
            console.warn("panoId 없음:", index);
            return;
          }
          streetView.setPanoId(panoId, rvLatLng);
          streetView.setViewpoint({ pan: rvPos.pan, tilt: 0, zoom: -100 });
        });
      }
      window.moveStreetViewToIndex = moveStreetViewToIndex;


      // function getHeadLocalPos() {
      //   switch (currentCharIndex) {
      //     case 0: // 캐릭터 1
      //       return vec3.fromValues(0, 0.80, 0);
      //     case 1: // 캐릭터 2
      //       return vec3.fromValues(0, 0.80, 0);   
      //     case 2: // 캐릭터 3
      //       return vec3.fromValues(0, 0.80, 0); 
      //     default:
      //       return vec3.fromValues(0, 0.80, 0);
      //   }
      // }

      function createCharacterNode(index) {
        const node = new Gltf2Node({ url: CHARACTER_URLS[index] });
        node.scale = [0.4, 0.4, 0.4];
        return node;
      }

      // 기본 dudu는 char1 (index 0)
      let dudu = createCharacterNode(currentCharIndex);
      arObject.addNode(dudu);

      // 버튼에서 호출할 캐릭터 교체 함수
      function switchCharacter(index) {
        if (index === currentCharIndex) return;

        currentCharIndex = index;

        // 기본 arObject 안의 모델 교체
        if (dudu) {
          arObject.removeNode(dudu);
        }
        dudu = createCharacterNode(index);
        arObject.addNode(dudu);

        setOverlayModelByIndex(index);

        updateStreetViewPosition();
      }

      // app.js 에서 쓸 수 있게 전역으로 노출
      window.switchDuduCharacter = switchCharacter;


      let reticle = new Gltf2Node({url: '../media/gltf/reticle/reticle.gltf'});
      reticle.visible = false;
      scene.addNode(reticle);

      // Having a really simple drop shadow underneath an object helps ground
      // it in the world without adding much complexity.
      let shadow = new DropShadowNode();
      vec3.set(shadow.scale, 0.15, 0.15, 0.15);
      arObject.addNode(shadow);

      const MAX_DUDUS = 1;
      let dudus = [];

      let currentDudu = null;   // 현재 씬에 있는 3D 모델 캐릭터 하나 기억

      // Ensure the background is transparent for AR.
      scene.clear = false;

      function initXR() {
        xrButton = new WebXRButton({
          onRequestSession: onRequestSession,
          onEndSession: onEndSession,
          textEnterXRTitle: "AR 시작하기",
          textXRNotFoundTitle: "AR을 지원하지 않는 기기",
          textExitXRTitle: "AR  종료하기",
        });
        document.querySelector('header').appendChild(xrButton.domElement);

        if (navigator.xr) {
          navigator.xr.isSessionSupported('immersive-ar')
                      .then((supported) => {
            xrButton.enabled = supported;
          });
        }
      }

      function onRequestSession() {
        return navigator.xr.requestSession('immersive-ar', {
          requiredFeatures: ['local', 'hit-test', 'dom-overlay'], 
          domOverlay: { root: document.body }, 
        }).then((session) => {
          xrButton.setSession(session);
          onSessionStarted(session);
        });
      }

      function onSessionStarted(session) {
        /* AR 카메라 화면에서는 WebXRButton UI 숨김 */
        xrButton.domElement.style.display = 'none';

        document.getElementById('ui-box').style.display = 'none';


        // 아래부터 기존 오픈소스 내용
        session.addEventListener('end', onSessionEnded);
        session.addEventListener('select', onSelect);

        if (!gl) {
          gl = createWebGLContext({
            xrCompatible: true
          });

          renderer = new Renderer(gl);

          scene.setRenderer(renderer);
        }

        session.updateRenderState({ 
          baseLayer: new XRWebGLLayer(session, gl),
          domOverlay: { root: document.body }, // 2D UI overlay 권한 획득
        });

        // In this sample we want to cast a ray straight out from the viewer's
        // position and render a reticle where it intersects with a real world
        // surface. To do this we first get the viewer space, then create a
        // hitTestSource that tracks it.
        session.requestReferenceSpace('viewer').then((refSpace) => {
          xrViewerSpace = refSpace;
          session.requestHitTestSource({ space: xrViewerSpace }).then((hitTestSource) => {
            xrHitTestSource = hitTestSource;
          });
        });

        session.requestReferenceSpace('local').then((refSpace) => {
          xrRefSpace = refSpace;

          session.requestAnimationFrame(onXRFrame);
        });


        // 로드뷰 진입 안내
        if (typeof appendNotice === "function") {
          appendNotice(
            "[로드뷰 화면은 카카오맵 API를 등록하면 표시됩니다.]"
          );
        }

        const streetViewStageEl = document.getElementById("streetViewStage");
        if (streetViewStageEl) streetViewStageEl.style.display = "block";

        ensureStreetViewCreated();
        // 로드뷰 먼저 전개
        applyModeUI(true);

        // 로드뷰 시작 위치
        moveStreetViewToIndex(
          (typeof window.remoteIndex === "number") ? window.remoteIndex : 0
        );
        setDuduOpacity(false);

        // try {
        //   const streetViewContainer = document.getElementById('streetView'); //로드뷰를 표시할 div

      // Adds a new object to the scene at the
      // specified transform.
      function addARObjectAt(matrix) {
        arObject.visible = true;

        // matrix 복사
        const m = mat4.clone(matrix);

        /** Y축으로 아래로 내리기 (값 조절 포인트) **/
        mat4.translate(m, m, [0, 0.0, 0]);

        arObject.matrix = m;
        currentDudu = arObject;
      

        // 필요하면 배열에 한 번만 넣어둠
        if (!dudus.includes(arObject)) {
          dudus.push(arObject);
        }

        if (typeof window.playUiSound === "function") {
          window.playUiSound(5);
        }

        window.hasDuduPlaced = true;


        // For performance reasons if we add too many objects start
        // removing the oldest ones to keep the scene complexity
        // from growing too much.
        if (dudus.length > MAX_DUDUS) {
          let oldDudu = dudus.shift();
          scene.removeNode(oldDudu);
        }
      }

      let rayOrigin = vec3.create();
      let rayDirection = vec3.create();
      function onSelect(event) {
        if (!arSwitch) {
          reticle.visible = false;
          return;
        }

        if (reticle.visible) {
          // 최근에 UI를 탭했다면 이 select는 무시
          const now = performance.now();
          if (now - lastUiTapTime < UI_TAP_IGNORE_WINDOW) {
            // console.log('Ignoring XR select caused by UI tap');
            return;
          }

          // The reticle should already be positioned at the latest hit point, 
          // so we can just use it's matrix to save an unnecessary call to 
          // event.frame.getHitTestResults.
          addARObjectAt(reticle.matrix);
        }
      }

      // Called every time a XRSession requests that a new frame be drawn.
      function onXRFrame(t, frame) {
        let session = frame.session;
        let pose = frame.getViewerPose(xrRefSpace);

        reticle.visible = false;

        // 로드뷰 켜져 있으면 reticle 업데이트 자체를 스킵
        if (!arSwitch) {
          session.requestAnimationFrame(onXRFrame);
          return;
        }

        // If we have a hit test source, get its results for the frame
        // and use the pose to display a reticle in the scene.
        if (xrHitTestSource && pose) {
          let hitTestResults = frame.getHitTestResults(xrHitTestSource);
          if (hitTestResults.length > 0) {
            let pose = hitTestResults[0].getPose(xrRefSpace);
            let m = pose.transform.matrix;

            // Y축이 거의 1이면 = 0도 (바닥)
            const yUp = m[5]; // column-major 기준

            if (yUp >= 0.9) {
              reticle.visible = true;
              reticle.matrix = m;
            } else {
              reticle.visible = false;
            }
          }
        }


        scene.startFrame();

        session.requestAnimationFrame(onXRFrame);

        scene.drawXRFrame(frame, pose);

        scene.endFrame();
      }

      // Start the XR application.
      initXR();
